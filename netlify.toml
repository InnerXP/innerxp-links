[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# A Resonance Link, `/r/<code>` (spec 3.8 Referral, KAN-84) — the page a link
# shows where the app is not installed. A 200 rewrite, not a redirect: the
# browser keeps `/r/<code>` and the page reads the code off its own path.
#
# Once the landing subdomain exists (REFERRAL_FLOW_PLAN § 4.4, Q7), this host
# answers `/r/*` with a 302 to it instead, and the same page served there grows
# an *Open* button — iOS will not open the app from a link to this host while
# the reader is on it.
[[redirects]]
  from = "/r/*"
  to = "/referral.html"
  status = 200
